version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: price_mgmt_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: price_management
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - price_mgmt_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: price_mgmt_cache
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - price_mgmt_network

networks:
  price_mgmt_network:
    driver: bridge
