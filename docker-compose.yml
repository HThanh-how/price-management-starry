# =============================================
# Docker Compose — Full Stack Deployment
# Services: MySQL, Redis, Backend API, Frontend, Nginx
# =============================================
# Port mapping: Host 8080 → Nginx → Backend/Frontend

services:
  # ========================================
  # MySQL 8 Database
  # ========================================
  mysql:
    image: mysql:8.0
    container_name: price-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-StrongP@ss2026!}
      MYSQL_DATABASE: price_management
    # ports: not exposed to host (MySQL already running on host)
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-StrongP@ss2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Redis Cache
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: price-redis
    restart: unless-stopped
    # ports: not exposed to host (Redis already running on host)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========================================
  # .NET 10 Backend API
  # ========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: price-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: price_management
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-StrongP@ss2026!}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ASPNETCORE_ENVIRONMENT: Production
      AllowedCorsOrigins__0: http://localhost:8080
      AllowedCorsOrigins__1: http://20.20.20.160:8080
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========================================
  # Next.js Frontend
  # ========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    container_name: price-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy

  # ========================================
  # Nginx Reverse Proxy (Entry Point)
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: price-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
  redis_data:
