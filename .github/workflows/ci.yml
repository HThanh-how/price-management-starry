# =============================================
# CI/CD Pipeline — Price Management Tool
# Triggers on push/PR to main branch
# Jobs: Backend (.NET 10) + Frontend (Next.js)
# =============================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ========================================
  # Backend: .NET 10 Build + Unit Tests
  # ========================================
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/tests/**/TestResults/*.trx

  # ========================================
  # Frontend: Next.js Build + Lint + Tests
  # ========================================
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint || true

      - name: Run unit tests
        run: npx vitest run --reporter=verbose || true

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api/v1

  # ========================================
  # Docker Build Validation
  # ========================================
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -f Dockerfile.backend -t price-backend:test .

      - name: Build frontend Docker image
        run: docker build -f Dockerfile.frontend -t price-frontend:test --build-arg NEXT_PUBLIC_API_URL=/api/v1 .
