name: Generate Executive Summary PDF

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - '.github/workflows/generate-pdf.yml'
  workflow_dispatch:

jobs:
  build_pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert WebP to PNG (Ubuntu Runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          cd docs/assets
          for f in *.webp; do dwebp "$f" -o "${f%.*}.png"; done
          ls -la *.png

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Executive_Summary.tex
          working_directory: docs
          compiler: pdflatex

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starry_PriceManagement_Technical_Whitepaper
          path: docs/Executive_Summary.pdf

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: Enterprise-Whitepaper
          name: "\U0001F680 Enterprise Technical Whitepaper (Latest)"
          body: "Technical Whitepaper auto-compiled from LaTeX. Download the PDF below."
          files: docs/Executive_Summary.pdf
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
